<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vasyl Kazmenko — Web design &amp; development</title>
    <meta
      name="description"
      content="I design and build websites for businesses — storefronts, booking pages and lead generation. Considered design, fast on mobile. Software developer at Fiserv."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#c8ff3d" />

    <link rel="canonical" href="https://vkazmenko.com/" />

    <!-- Link previews (texts, WhatsApp, Slack). Absolute URLs: scrapers do not
         reliably resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vkazmenko.com/" />
    <meta property="og:title" content="Vasyl Kazmenko — Web design &amp; development" />
    <meta
      property="og:description"
      content="I build websites for businesses — storefronts, booking pages and lead generation. From $150. Call or text 267-902-9839."
    />
    <meta property="og:image" content="https://vkazmenko.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Ties this site to the Google Business Profile. The name, phone and
         URL must match the listing exactly or Google treats them as two
         different businesses. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Kazmenko Web Development",
        "description": "Websites, online stores and booking systems for small businesses.",
        "url": "https://vkazmenko.com/",
        "image": "https://vkazmenko.com/og.jpg",
        "telephone": "+1-267-902-9839",
        "email": "kazmenkovasya@gmail.com",
        "priceRange": "$$",
        "founder": { "@type": "Person", "name": "Vasyl Kazmenko" },
        "areaServed": { "@type": "City", "name": "Philadelphia", "address": { "@type": "PostalAddress", "addressRegion": "PA", "addressCountry": "US" } },
        "knowsAbout": ["Web design", "Online stores", "Booking systems", "Payment integration"],
        "sameAs": [
          "https://www.linkedin.com/in/vasyl-kazmenko-4172ab1a6/",
          "https://github.com/Kazmenko-Vasyl"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
